version: '3.9'

services:

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: airport
      POSTGRES_USER: airport_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secret}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airport_user -d airport"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/airport
      SPRING_DATASOURCE_USERNAME: airport_user
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-secret}
      AIRPORT_JWT_SECRET: ${JWT_SECRET:-change-me-in-production-very-long-secret}
    networks:
      - internal
      - web
    expose:
      - "8080"

  web-dispatcher:
    build:
      context: ./clients/web-dispatcher/web-dispatcher-app
      args:
        VITE_API_BASE: ${PUBLIC_URL:-http://localhost}
    restart: unless-stopped
    networks:
      - web
    expose:
      - "80"

  web-board:
    build:
      context: ./clients/web-board/web-board-app
      args:
        VITE_API_BASE: ${PUBLIC_URL:-http://localhost}
    restart: unless-stopped
    networks:
      - web
    expose:
      - "80"

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    depends_on:
      - backend
      - web-dispatcher
      - web-board
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - web

networks:
  internal:
  web:

volumes:
  postgres_data:
