spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/airport
    username: airport_user
    password: airport_pass
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none        # Flyway управляет схемой, Hibernate только проверяет
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  cache:
    type: simple                # Кэш справочников в памяти

server:
  port: 8080

# Swagger UI: http://localhost:8080/swagger-ui.html  (OpenAPI JSON: /v3/api-docs)
springdoc:
  swagger-ui:
    tags-sorter: alpha
    operations-sorter: alpha

jwt:
  secret: airport-secret-key-change-in-production-must-be-long
  expiration: 86400000          # 24 часа в миллисекундах

# Интервал автообновления статусов рейсов (мс), задача 3 FirstLab
airport:
  scheduler:
    flight-status-ms: 60000