spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/airport
    username: airport_user
    password: airport_pass
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none        # Flyway управляет схемой, Hibernate только проверяет
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    schemas: public
    locations: classpath:db/migration
    baseline-on-migrate: true

  cache:
    type: simple                # Кэш справочников в памяти

server:
  port: 8080

logging:
  level:
    ru.airport.service.FlightAutoStatusService: INFO
    ru.airport.service.FlightAutoStatusProcessor: INFO
    ru.airport.scheduler.FlightStatusScheduler: INFO

jwt:
  secret: airport-secret-key-change-in-production-must-be-long
  expiration: 86400000          # 24 часа в миллисекундах

# Домашний аэропорт АОС (IATA) и планировщик статусов рейсов
airport:
  home-iata: SVO
  timezone: Europe/Moscow
  allowed-origins:
    - "http://localhost:*"
    - "http://127.0.0.1:*"
    - "https://45.133.74.67"
  gate-plan-window-hours: 12
  gate-post-grace-minutes: 15
  schedule-generation-horizon-days: 365
  scheduler:
    flight-status-ms: 60000
    outbound-delay-grace-minutes: 5
    inbound-gate-delay-minutes: 5
    auto-cancel-hours-after-scheduled-departure: 24
    max-actual-time-future-skew-minutes: 120
    max-departure-early-hours: 24
    max-departure-late-hours: 48
    max-arrival-early-hours: 24
    max-arrival-late-hours: 48