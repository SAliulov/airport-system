worker_processes  auto;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # ------------------------------------------------------------------
    # HTTP → HTTPS редирект + пропуск для обновления сертификатов acme.sh
    # ------------------------------------------------------------------
    server {
        listen 80;
        server_name 45.133.74.67;

        # Важно: acme.sh проверяет права на домен/IP именно по этому пути на 80 порту
        location /.well-known/acme-challenge/ {
            root /var/www/acme-challenge;
        }

        # Все остальные запросы принудительно шлем на HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ------------------------------------------------------------------
    # HTTPS Сервер
    # ------------------------------------------------------------------
    server {
        listen 443 ssl;
        server_name 45.133.74.67;

        # Пути к сертификатам внутри контейнера (совпадают с docker-compose)
        ssl_certificate     /etc/nginx/ssl/fullchain.cer;
        ssl_certificate_key /etc/nginx/ssl/45.133.74.67.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        # ------------------------------------------------------------------
        # Диспетчер (SPA) — доступен по адресу / и /dispatcher
        # ------------------------------------------------------------------
        location /dispatcher/ {
            alias /usr/share/nginx/dispatcher/;
            try_files $uri $uri/ /dispatcher/index.html;
        }

        location /dispatcher {
            return 301 /dispatcher/;
        }

        # Корневой URL перенаправляет на диспетчера
        location = / {
            root /usr/share/nginx/dispatcher;
            index index.html;
            try_files $uri /dispatcher/index.html;
        }

        # ------------------------------------------------------------------
        # Онлайн-Табло (SPA) — доступно по адресу /board
        # ------------------------------------------------------------------
        location /board/ {
            alias /usr/share/nginx/board/;
            try_files $uri $uri/ /board/index.html;
        }

        location /board {
            return 301 /board/;
        }

        # ------------------------------------------------------------------
        # API — прокси на Spring Boot бэкенд
        # ------------------------------------------------------------------
        location /api/ {
            proxy_pass http://127.0.0.1:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ------------------------------------------------------------------
        # WebSocket (STOMP) — прокси с поддержкой Upgrade-заголовков
        # ------------------------------------------------------------------
        location /ws {
            proxy_pass http://127.0.0.1:8080;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400s;
        }
    }
}